<!DOCTYPE html>
<html>

<body>
  <canvas id="parcelCanvas"></canvas>

  <script>
    const canvas = document.getElementById('parcelCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();

    // Replace with your local path or URL
    img.src = 'parcel.png';

    const data = {
      "polygons": [
        [[0.24, 0.08], [0.40, 0.08], [0.44, 0.57], [0.26, 0.42], [0.08, 0.42]],
        [[0.40, 0.08], [0.70, 0.08], [0.44, 0.57]],
        [[0.70, 0.08], [0.66, 0.76], [0.44, 0.57]],
        [[0.70, 0.08], [0.74, 0.15], [0.93, 0.61], [0.66, 0.76]],
        [[0.44, 0.57], [0.66, 0.76], [0.26, 0.95]],
        [[0.08, 0.42], [0.26, 0.42], [0.44, 0.57], [0.26, 0.95]]
      ]
    };

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;

      // Draw the original image
      ctx.drawImage(img, 0, 0);

      // Set drawing styles
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#00FF00'; // Neon green for visibility

      data.polygons.forEach(poly => {
        ctx.beginPath();
        poly.forEach((point, index) => {
          // Scale normalized [0-1] to actual pixel [w, h]
          const x = point[0] * canvas.width;
          const y = point[1] * canvas.height;

          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.stroke();
      });
    };
  </script>
</body>

</html>
